name: CI — Build & Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend build check ────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (production)
        run: npm run build
        env:
          VITE_API_URL: ""
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "--- Build contents ---"
          ls -la dist/
          test -f dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          echo "✅ Frontend build passed — dist/index.html present"

  # ── Backend smoke test ──────────────────────────────────────────────────────
  backend:
    name: Backend — Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Download NLTK data
        run: |
          python - <<'EOF'
          import nltk
          packages = [
              'punkt', 'punkt_tab', 'stopwords', 'wordnet',
              'vader_lexicon', 'averaged_perceptron_tagger',
              'averaged_perceptron_tagger_eng', 'omw-1.4',
          ]
          for p in packages:
              try:
                  nltk.download(p, quiet=True)
                  print(f'  OK: {p}')
              except Exception as e:
                  print(f'  WARN (non-fatal): {p} — {e}')
          print('NLTK data download complete.')
          EOF

      - name: Smoke test — NLP sentiment
        run: |
          python - <<'EOF'
          from services.nlp_engine import vader_sentiment
          r = vader_sentiment('This product is amazing!')
          assert r['label'] == 'Positive', f"Expected Positive, got {r['label']}"
          print(f"✅ NLP engine: {r['label']} (compound={r['compound']})")
          EOF

      - name: Smoke test — FastAPI app loads
        run: |
          python - <<'EOF'
          from main import app
          assert app.title == 'InsightPulse API', f"Wrong title: {app.title}"
          assert len(app.routes) > 5, f"Too few routes: {len(app.routes)}"
          print(f"✅ FastAPI app loads OK — {len(app.routes)} routes registered")
          EOF

      - name: Smoke test — health endpoint (httpx)
        run: |
          python - <<'EOF'
          import asyncio
          from httpx import AsyncClient, ASGITransport
          from main import app

          async def run():
              async with AsyncClient(
                  transport=ASGITransport(app=app),
                  base_url='http://testserver'
              ) as client:
                  r = await client.get('/api/health')
                  assert r.status_code == 200, f"Expected 200, got {r.status_code}"
                  data = r.json()
                  assert data['status'] == 'healthy', f"Expected healthy, got {data}"
                  print(f"✅ /api/health: {data['status']}")

          asyncio.run(run())
          EOF

      - name: Smoke test — upload info endpoint
        run: |
          python - <<'EOF'
          import asyncio
          from httpx import AsyncClient, ASGITransport
          from main import app

          async def run():
              async with AsyncClient(
                  transport=ASGITransport(app=app),
                  base_url='http://testserver'
              ) as client:
                  r = await client.get('/api/upload/info?filename=test.csv')
                  assert r.status_code == 200, f"Expected 200, got {r.status_code}"
                  data = r.json()
                  assert data['allowed'] is True, f"CSV should be allowed: {data}"
                  print(f"✅ /api/upload/info: allowed={data['allowed']}")

          asyncio.run(run())
          EOF
